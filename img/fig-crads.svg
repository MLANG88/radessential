<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860"><defs></defs><rect x="0" y="0" width="1200" height="860" rx="0" fill="#ffffff" stroke="none" stroke-width="1" /><rect x="0" y="0" width="1200" height="6" rx="0" fill="#007590" stroke="none" stroke-width="1" /><text x="32" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0d1a23" text-anchor="start">C-RADS: CT colonography reporting</text><text x="32" y="74" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#566874" text-anchor="start">Colonic (C) and extracolonic (E) categories · Zalis et al., Radiology 2005</text><rect x="32" y="120" width="1136" height="82" rx="12" fill="#f1f5f7" stroke="none" stroke-width="1" /><rect x="48" y="140" width="70" height="42" rx="8" fill="#ffffff" stroke="#566874" stroke-width="1.5" /><text x="83.0" y="168.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#566874" text-anchor="middle">C0</text><text x="140" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1b24" text-anchor="start">Inadequate study</text><text x="140" y="176" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#566874" text-anchor="start">Poor prep or insufflation, cannot exclude ≥10 mm</text><text x="140" y="193" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#566874" text-anchor="start">lesion; or awaiting priors</text><text x="1150" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#566874" text-anchor="end">Repeat or complete the study</text><rect x="32" y="212" width="1136" height="82" rx="12" fill="#e1f3e9" stroke="none" stroke-width="1" /><rect x="48" y="232" width="70" height="42" rx="8" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.5" /><text x="83.0" y="260.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f7a4d" text-anchor="middle">C1</text><text x="140" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1b24" text-anchor="start">Normal or benign</text><text x="140" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#566874" text-anchor="start">No polyp ≥6 mm; lipoma, inverted diverticulum,</text><text x="140" y="285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#566874" text-anchor="start">diverticulosis</text><text x="1150" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f7a4d" text-anchor="end">Routine screening every 5–10 years</text><path d="M560,278 Q620,272 680,278 T800,278" fill="none" stroke="#b07a6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="32" y="304" width="1136" height="82" rx="12" fill="#fcefd7" stroke="none" stroke-width="1" /><rect x="48" y="324" width="70" height="42" rx="8" fill="#ffffff" stroke="#985c00" stroke-width="1.5" /><text x="83.0" y="352.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#985c00" text-anchor="middle">C2</text><text x="140" y="338" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1b24" text-anchor="start">Intermediate polyp</text><text x="140" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#566874" text-anchor="start">6–9 mm polyp(s), fewer than 3; or indeterminate</text><text x="140" y="377" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#566874" text-anchor="start">finding</text><text x="1150" y="352" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#985c00" text-anchor="end">Surveillance (≥3 years) or colonoscopy</text><path d="M560,370 Q620,364 680,370 T800,370" fill="none" stroke="#b07a6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M660,368 Q672,346 684,368" fill="#d9a294" stroke="#8c5a4c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="672" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#985c00" text-anchor="middle">6–9 mm</text><rect x="32" y="396" width="1136" height="82" rx="12" fill="#fbe4e1" stroke="none" stroke-width="1" /><rect x="48" y="416" width="70" height="42" rx="8" fill="#ffffff" stroke="#b0281e" stroke-width="1.5" /><text x="83.0" y="444.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b0281e" text-anchor="middle">C3</text><text x="140" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1b24" text-anchor="start">Possibly advanced adenoma</text><text x="140" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#566874" text-anchor="start">Polyp ≥10 mm, or 3 or more polyps of 6–9 mm</text><text x="1150" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#b0281e" text-anchor="end">Colonoscopy</text><path d="M560,462 Q620,456 680,462 T800,462" fill="none" stroke="#b07a6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M650,460 Q680,412 710,460" fill="#d9a294" stroke="#8c5a4c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="680" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b0281e" text-anchor="middle">≥10 mm</text><rect x="32" y="488" width="1136" height="82" rx="12" fill="#fbe4e1" stroke="none" stroke-width="1" /><rect x="48" y="508" width="70" height="42" rx="8" fill="#ffffff" stroke="#b0281e" stroke-width="1.5" /><text x="83.0" y="536.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b0281e" text-anchor="middle">C4</text><text x="140" y="522" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f1b24" text-anchor="start">Colonic mass, likely malignant</text><text x="140" y="544" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#566874" text-anchor="start">Lumen-compromising mass or extracolonic invasion</text><text x="1150" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#b0281e" text-anchor="end">Surgical consultation</text><path d="M560,554 Q620,548 680,554 T800,554" fill="none" stroke="#b07a6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M620,552 Q630,494 680,496 Q735,498 740,552" fill="#c98778" stroke="#8c5a4c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M620,500 Q680,518 740,500" fill="none" stroke="#b07a6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="594" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#566874" text-anchor="start">EXTRACOLONIC FINDINGS</text><rect x="32" y="610" width="218" height="214" rx="12" fill="#eef2f4" stroke="none" stroke-width="1" /><rect x="46" y="624" width="56" height="34" rx="8" fill="#ffffff" stroke="#566874" stroke-width="1.5" /><text x="74.0" y="647.12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#566874" text-anchor="middle">E0</text><text x="46" y="686" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1b24" text-anchor="start">Limited exam</text><text x="46" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">Artifact severely limits</text><text x="46" y="726" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">soft tissues</text><rect x="262" y="610" width="218" height="214" rx="12" fill="#e1f3e9" stroke="none" stroke-width="1" /><rect x="276" y="624" width="56" height="34" rx="8" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.5" /><text x="304.0" y="647.12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f7a4d" text-anchor="middle">E1</text><text x="276" y="686" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1b24" text-anchor="start">Normal or variant</text><text x="276" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">e.g. retroaortic left renal</text><text x="276" y="726" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">vein</text><rect x="492" y="610" width="218" height="214" rx="12" fill="#e1f3e9" stroke="none" stroke-width="1" /><rect x="506" y="624" width="56" height="34" rx="8" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.5" /><text x="534.0" y="647.12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f7a4d" text-anchor="middle">E2</text><text x="506" y="686" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1b24" text-anchor="start">Clinically unimportant</text><text x="506" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">Simple liver or renal cyst,</text><text x="506" y="726" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">gallstones, vertebral</text><text x="506" y="742" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">hemangioma. No work-up</text><rect x="722" y="610" width="218" height="214" rx="12" fill="#fcefd7" stroke="none" stroke-width="1" /><rect x="736" y="624" width="56" height="34" rx="8" fill="#ffffff" stroke="#985c00" stroke-width="1.5" /><text x="764.0" y="647.12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#985c00" text-anchor="middle">E3</text><text x="736" y="686" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1b24" text-anchor="start">Likely unimportant,</text><text x="736" y="704" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1b24" text-anchor="start">incompletely</text><text x="736" y="722" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1b24" text-anchor="start">characterized</text><text x="736" y="746" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">e.g. minimally complex or</text><text x="736" y="762" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">hyperattenuating renal cyst.</text><text x="736" y="778" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">Work-up per local practice</text><rect x="952" y="610" width="218" height="214" rx="12" fill="#fbe4e1" stroke="none" stroke-width="1" /><rect x="966" y="624" width="56" height="34" rx="8" fill="#ffffff" stroke="#b0281e" stroke-width="1.5" /><text x="994.0" y="647.12" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#b0281e" text-anchor="middle">E4</text><text x="966" y="686" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f1b24" text-anchor="start">Potentially important</text><text x="966" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">Solid renal mass,</text><text x="966" y="726" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">adenopathy, aortic aneurysm,</text><text x="966" y="742" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">non-calcified lung nodule ≥1</text><text x="966" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#566874" text-anchor="start">cm. Communicate</text></svg>